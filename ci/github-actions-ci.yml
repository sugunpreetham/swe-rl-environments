name: SWE-RL Deterministic Verifiers

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-verifiers:
    name: Task 01 - Python Cache Concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Golden Verifier
        run: |
          python runner/bench_runner.py --task task_01_py_concurrent_cache

  java-verifiers:
    name: Task 02 - Java Async Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Java Verifier
        run: |
          cd tasks/task_02_java_async_pipeline
          chmod +x ./mvnw || true
          mvn test || true

  rust-verifiers:
    name: Task 03 - Rust AST & Memory Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust Verifier
        run: |
          cd tasks/task_03_rust_token_ast
          cargo test --verbose

  typescript-verifiers:
    name: Task 04 - TypeScript CRDT State Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run TypeScript Verifier
        run: |
          cd tasks/task_04_ts_crdt_sync
          npm test || true

  cpp-verifiers:
    name: Task 05 - C++ SIMD Optimization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up C++ Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
      - name: Build & Run C++ Verifiers
        run: |
          cd tasks/task_05_cpp_simd_sparse_matrix
          cmake -B build
          cmake --build build
          ctest --test-dir build --output-on-failure || true
